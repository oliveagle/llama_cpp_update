<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}llama.cpp 模型测试报告{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-cpu"></i> llama.cpp 模型测试报告
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-house"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/stage1' %}active{% endif %}" href="/stage1">
                            <i class="bi bi-1-circle"></i> Stage 1
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/stage2' %}active{% endif %}" href="/stage2">
                            <i class="bi bi-2-circle"></i> Stage 2
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/stage3' %}active{% endif %}" href="/stage3">
                            <i class="bi bi-3-circle"></i> Stage 3
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/methodology' %}active{% endif %}" href="/methodology">
                            <i class="bi bi-book"></i> 测试规范
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-light text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">llama.cpp 模型评估框架 | 测试时间: 2026-02-18</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
