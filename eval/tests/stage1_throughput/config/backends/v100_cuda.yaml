# CUDA Backend Configuration - NVIDIA V100 (Tesla V100 32GB)
backend:
  type: cuda
  name: "CUDA on NVIDIA V100"
  device: V100
  compute_capability: "7.0"

server:
  port: 8401
  binary_path: "/home/oliveagle/opt/llama.cpp/build/bin/llama-server"
  base_url: "http://localhost:8401"

  # CUDA 特定环境变量
  env:
    CUDA_VISIBLE_DEVICES: "0"

  # 通用参数
  default_params:
    n_ctx: 131072
    n_batch: 2048
    n_ubatch: 512
    n_threads: 8
    n_threads_batch: 8
    embeddings: true

  # 模型并行配置
  model_params:
    ngl: 99  # 所有层 offload 到 GPU

# 测试配置
testing:
  timeout: 300

  test_defaults:
    prompt_processing:
      prompt_length: 4096
      max_tokens: 1

    token_generation:
      prompt_length: 1024
      max_tokens: 512

    context_scaling:
      base_context: 4096
      max_context: 131072
      step_multiplier: 2

# 性能预期
performance:
  min_prompt_tps: 100.0
  min_generation_tps: 20.0
