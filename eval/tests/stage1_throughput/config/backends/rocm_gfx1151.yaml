# ROCm Backend Configuration - AMD gfx1151 (Strix Halo)
backend:
  type: rocm
  name: "ROCm on AMD gfx1151"
  device: gfx1151
  hip_arch: "gfx1151"

server:
  port: 8405
  binary_path: "/home/oliveagle/ROCm/llama.cpp/build/bin/llama-server"
  base_url: "http://localhost:8405"

  # ROCm 特定环境变量
  env:
    HSA_OVERRIDE_GFX_VERSION: "11.5.1"
    HIP_VISIBLE_DEVICES: "0"

  # 通用参数
  default_params:
    n_ctx: 32768
    n_batch: 2048
    n_ubatch: 512
    n_threads: 16
    n_threads_batch: 16
    embeddings: true

  model_params:
    ngl: 99

# 测试配置
testing:
  timeout: 300

  test_defaults:
    prompt_processing:
      prompt_length: 4096
      max_tokens: 1

    token_generation:
      prompt_length: 1024
      max_tokens: 512

    context_scaling:
      base_context: 4096
      max_context: 65536
      step_multiplier: 2

performance:
  min_prompt_tps: 50.0
  min_generation_tps: 10.0
