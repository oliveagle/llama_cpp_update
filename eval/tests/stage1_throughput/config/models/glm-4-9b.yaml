# GLM-4-9B 模型特定配置
model:
  id: "GLM-4-9B"
  gguf_pattern: "*glm-4-9b*Q4_K_M.gguf"

  backend_overrides:
    vulkan:
      ngl: 99
      chat_template: "glm4"

    cuda:
      ngl: 99
      chat_template: "glm4"
      # CUDA 版本支持更大的 context
      n_ctx: 131072

  expected_performance:
    vulkan:
      prompt_tps: 80
      generation_tps: 15
    cuda:
      prompt_tps: 180
      generation_tps: 35

  test_config:
    context_scaling:
      max: 131072  # 128K context support
