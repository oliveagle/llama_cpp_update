# 通用模型配置 - 作为所有模型的基础默认配置
model:
  # 基础参数（所有模型通用）
  base_params:
    temperature: 0.7
    top_p: 0.9
    repeat_penalty: 1.1

  # 量化级别到文件后缀的映射
  quantization:
    q4_k_m: "Q4_K_M"
    q5_k_m: "Q5_K_M"
    q6_k: "Q6_K"
    q8_0: "Q8_0"
    fp16: "F16"

  # 默认测试配置
  test_config:
    # Prompt 处理测试
    prompt_processing:
      prompt_lengths: [512, 1024, 2048, 4096, 8192, 16384]
      iterations: 3  # 每个长度测试次数

    # Token 生成测试
    token_generation:
      prompt_length: 1024
      max_tokens_list: [128, 256, 512, 1024]
      iterations: 3

    # Context 扩展测试
    context_scaling:
      base: 4096
      max: 131072
      steps: [4096, 8192, 16384, 32768, 65536, 131072]
