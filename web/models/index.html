<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型独立报告 | llama.cpp 评测报告</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .page-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .model-card {
            background: var(--card-bg, #ffffff);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            border-left: 4px solid #e2e8f0;
        }
        .model-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .model-card.excellent { border-left-color: #10b981; }
        .model-card.good { border-left-color: #3b82f6; }
        .model-card.average { border-left-color: #f59e0b; }
        .model-card.poor { border-left-color: #ef4444; }
        .model-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary, #1e293b);
        }
        .model-size {
            display: inline-block;
            background: #f1f5f9;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 1rem;
        }
        .model-score {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        .score-number {
            font-size: 2rem;
            font-weight: 700;
        }
        .score-number.excellent { color: #10b981; }
        .score-number.good { color: #3b82f6; }
        .score-number.average { color: #f59e0b; }
        .score-number.poor { color: #ef4444; }
        .score-label {
            font-size: 0.9rem;
            color: #64748b;
        }
        .score-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 0.75rem;
            overflow: hidden;
        }
        .score-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .score-bar-fill.excellent { background: #10b981; }
        .score-bar-fill.good { background: #3b82f6; }
        .score-bar-fill.average { background: #f59e0b; }
        .score-bar-fill.poor { background: #ef4444; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color, #2563eb);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .stats-bar {
            background: var(--card-bg, #ffffff);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .stats-item {
            text-align: center;
        }
        .stats-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2563eb;
        }
        .stats-label {
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="margin-bottom: 1rem;">
            <a href="/" class="back-link">🏠 Dashboard</a>
            <a href="../stage2.html" class="back-link" style="margin-left: 1rem;">← 返回 Stage 2 报告</a>
        </div>

        <div class="page-header">
            <h1>📊 模型独立报告</h1>
            <p>每个模型的详细评测结果与分析</p>
        </div>

        <div class="stats-bar">
            <div class="stats-item">
                <div class="stats-value">8</div>
                <div class="stats-label">已测模型</div>
            </div>
            <div class="stats-item">
                <div class="stats-value">3</div>
                <div class="stats-label">评测维度</div>
            </div>
            <div class="stats-item">
                <div class="stats-value">Vulkan</div>
                <div class="stats-label">测试后端</div>
            </div>
        </div>

        <div class="model-grid" id="modelGrid">
            <!-- Model cards will be inserted here -->
        </div>

        <footer style="text-align: center; padding: 2rem; color: #64748b;">
            <p>llama.cpp 模型评测报告 | 生成时间: 2026-02-18</p>
        </footer>
    </div>

    <script>
        // Model data loaded from eval results
        const models = [
            {
                name: "Qwen3-Coder-Next-Q4_K_M",
                size: "15B",
                score: 87.5,
                file: "Qwen3-Coder-Next-Q4_K_M.html"
            },
            {
                name: "Qwen3-VL-8B-Instruct-abliterated-v2.Q8_0",
                size: "8B",
                score: 83.3,
                file: "Qwen3-VL-8B-Instruct-abliterated-v2.Q8_0.html"
            },
            {
                name: "Qwen3VL-4B-Instruct-Q8_0",
                size: "4B",
                score: 80.0,
                file: "Qwen3VL-4B-Instruct-Q8_0.html"
            },
            {
                name: "MiniCPM-o-4_5-Q4_K_M",
                size: "4.5B",
                score: 73.3,
                file: "MiniCPM-o-4_5-Q4_K_M.html"
            },
            {
                name: "GLM-4.7-Flash-Q4_K_M",
                size: "4.7B",
                score: 70.0,
                file: "GLM-4.7-Flash-Q4_K_M.html"
            },
            {
                name: "GLM-4.7-Flash-REAP-23B-A3B-IQ4_NL",
                size: "23B",
                score: 66.7,
                file: "GLM-4.7-Flash-REAP-23B-A3B-IQ4_NL.html"
            },
            {
                name: "MiroThinker-v1.5-30B.Q8_0",
                size: "30B",
                score: 63.3,
                file: "MiroThinker-v1.5-30B.Q8_0.html"
            },
            {
                name: "Qwen3-4B-Instruct-2507-UD-Q4_K_XL",
                size: "4B",
                score: 0.0,
                file: "Qwen3-4B-Instruct-2507-UD-Q4_K_XL.html"
            }
        ];

        function getScoreClass(score) {
            if (score >= 80) return 'excellent';
            if (score >= 60) return 'good';
            if (score >= 40) return 'average';
            return 'poor';
        }

        function renderModels() {
            const grid = document.getElementById('modelGrid');
            grid.innerHTML = models.map(model => {
                const scoreClass = getScoreClass(model.score);
                return `
                    <a href="${model.file}" class="model-card ${scoreClass}">
                        <div class="model-name">${model.name}</div>
                        <span class="model-size">${model.size}</span>
                        <div class="model-score">
                            <span class="score-number ${scoreClass}">${model.score.toFixed(1)}%</span>
                            <span class="score-label">综合评分</span>
                        </div>
                        <div class="score-bar">
                            <div class="score-bar-fill ${scoreClass}" style="width: ${model.score}%"></div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        renderModels();
    </script>
</body>
</html>
